<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="planner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183b66" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#344054"/>
    </marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:34px;font-weight:700;fill:#172b4d}
      .subtitle{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:17px;fill:#5b6b82}
      .box-title{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:22px;font-weight:700;fill:#19324d}
      .box-text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:17px;fill:#44546a}
      .small{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:15px;fill:#53657c}
      .white-title{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:24px;font-weight:700;fill:white}
      .white-text{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:16px;fill:#eaf2ff}
      .section{font-family:'Microsoft YaHei','PingFang SC',sans-serif;font-size:20px;font-weight:700;fill:#245aa8}
      .flow{fill:none;stroke:#344054;stroke-width:3;marker-end:url(#arrow)}
      .feedback{fill:none;stroke:#2563eb;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#blueArrow)}
      .guide{fill:none;stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:7 7;marker-end:url(#blueArrow)}
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="55" text-anchor="middle" class="title">SciAssistant 自主科研与论文生成流程</text>
  <text x="960" y="84" text-anchor="middle" class="subtitle">旧 Agent 自主循环 + 证据约束 + 通用实验分析 + 四模型审稿 + 人机协作断点</text>

  <!-- Top preparation flow -->
  <g filter="url(#shadow)">
    <rect x="65" y="120" width="295" height="175" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="410" y="120" width="310" height="175" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="770" y="105" width="455" height="205" rx="18" fill="#ffffff" stroke="#0f9f78" stroke-width="2.5"/>
    <rect x="1280" y="105" width="550" height="205" rx="18" fill="url(#planner)"/>
  </g>

  <text x="212" y="157" text-anchor="middle" class="box-title">用户任务与资料</text>
  <text x="92" y="190" class="box-text">• 输入研究题目与写作要求</text>
  <text x="92" y="220" class="box-text">• 上传论文、数据或实验压缩包</text>
  <text x="92" y="250" class="box-text">• 可随时补充研究方向与指导</text>

  <text x="565" y="157" text-anchor="middle" class="box-title">资料解析与实验导入</text>
  <text x="438" y="190" class="box-text">• 自动解压并逐层读取说明</text>
  <text x="438" y="220" class="box-text">• 建立文件清单与内容摘要</text>
  <text x="438" y="250" class="box-text">• CSV、图像、文档按需处理</text>

  <text x="997" y="143" text-anchor="middle" class="box-title">证据准备与研究约束</text>
  <text x="800" y="177" class="box-text">• 多来源初始检索、去重、保存文献</text>
  <text x="800" y="207" class="box-text">• 有效参考文献底线：不少于 30 篇</text>
  <text x="800" y="237" class="box-text">• ResearchContract：明确目标、边界与交付</text>
  <text x="800" y="267" class="box-text">• Claims–Evidence Matrix：论点绑定真实证据</text>
  <text x="800" y="297" class="box-text">• 论文提纲 + VisualCommunicationPlanner</text>

  <text x="1555" y="145" text-anchor="middle" class="white-title">PlannerAgent：任务规划与动态分解</text>
  <text x="1315" y="182" class="white-text">• 读取研究约束、证据缺口、实验状态与图表计划</text>
  <text x="1315" y="214" class="white-text">• 分配检索、实验和写作子任务，最多自主迭代 50 轮</text>
  <text x="1315" y="246" class="white-text">• 子任务失败只重试失败项，不重新运行全部流程</text>
  <text x="1315" y="278" class="white-text">• 证据不足时重新规划，不以达到轮数冒充完成</text>

  <path d="M360 207 H402" class="flow"/>
  <path d="M720 207 H762" class="flow"/>
  <path d="M1225 207 H1272" class="flow"/>

  <!-- Web interaction sidebar -->
  <g filter="url(#shadow)">
    <rect x="65" y="370" width="300" height="590" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/>
    <rect x="65" y="370" width="300" height="62" rx="22" fill="#7c3aed"/>
    <rect x="65" y="410" width="300" height="22" fill="#7c3aed"/>
  </g>
  <text x="215" y="410" text-anchor="middle" class="white-title">Web 实时协作</text>
  <text x="92" y="466" class="box-text">实时显示“正在做什么”</text>
  <text x="92" y="498" class="small">• Planner 第几轮、规划摘要</text>
  <text x="92" y="526" class="small">• 正在搜索哪类文献及主要用途</text>
  <text x="92" y="554" class="small">• 正在处理哪组实验与生成何种图表</text>
  <text x="92" y="582" class="small">• 四位审稿人的中文意见与评分</text>
  <line x1="92" y1="608" x2="338" y2="608" stroke="#ddd6fe" stroke-width="2"/>
  <text x="92" y="642" class="box-text">分段论文实时预览</text>
  <text x="92" y="674" class="small">• Writer 每写完一段立即追加显示</text>
  <text x="92" y="702" class="small">• 工作轨迹与论文正文互不重叠</text>
  <line x1="92" y1="728" x2="338" y2="728" stroke="#ddd6fe" stroke-width="2"/>
  <text x="92" y="762" class="box-text">安全断点与细粒度指导</text>
  <text x="92" y="794" class="small">• Planner 规划前后</text>
  <text x="92" y="822" class="small">• Writer 开始写作前</text>
  <text x="92" y="850" class="small">• 综合修订开始前</text>
  <text x="92" y="878" class="small">• 子任务/工具完成后接收新关键词</text>
  <text x="92" y="906" class="small">• 暂停、继续或切换后续阶段</text>
  <text x="215" y="940" text-anchor="middle" class="small" fill="#7c3aed">SSE 增强通道持续推送状态</text>

  <!-- Autonomous loop -->
  <g filter="url(#shadow)">
    <rect x="425" y="370" width="1405" height="315" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/>
  </g>
  <text x="1127" y="408" text-anchor="middle" class="section">自主 Agent 研究循环：执行 → 检查证据 → 重新规划</text>
  <text x="1127" y="434" text-anchor="middle" class="small">三个执行角色不是固定各跑一次；Planner 会根据缺口反复调用，并在安全节点采纳用户指导</text>

  <g filter="url(#shadow)">
    <rect x="470" y="470" width="390" height="170" rx="17" fill="#eef7ff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="932" y="470" width="390" height="170" rx="17" fill="#eefbf6" stroke="#10b981" stroke-width="2"/>
    <rect x="1394" y="470" width="390" height="170" rx="17" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <text x="665" y="507" text-anchor="middle" class="box-title">InformationSeekerAgent</text>
  <text x="500" y="540" class="box-text">• 面向证据缺口扩展检索关键词</text>
  <text x="500" y="570" class="box-text">• 多来源搜索、网页抓取、文献提取</text>
  <text x="500" y="600" class="box-text">• DOI核验、去重并持续保存到文献库</text>
  <text x="500" y="628" class="small">不足 30 篇或论点缺证据时继续搜索</text>

  <text x="1127" y="507" text-anchor="middle" class="box-title">ExperimentAgent</text>
  <text x="962" y="540" class="box-text">• 识别领域、数据类型与实验目标</text>
  <text x="962" y="570" class="box-text">• 按需分析实验，不重复处理已完成结果</text>
  <text x="962" y="600" class="box-text">• 自主选择结构图、结果图、消融表格</text>
  <text x="962" y="628" class="small">结果登记到实验记录并绑定具体论点</text>

  <text x="1589" y="507" text-anchor="middle" class="box-title">WriterAgent</text>
  <text x="1424" y="540" class="box-text">• 按 ResearchContract 写完整论文</text>
  <text x="1424" y="570" class="box-text">• 每个核心论点必须有证据或引用</text>
  <text x="1424" y="600" class="box-text">• 分章节写作并推送实时段落预览</text>
  <text x="1424" y="628" class="small">禁止把无实验支撑的内容写成研究结论</text>

  <!-- planner to loop and feedback -->
  <path d="M1555 310 V338 H665 V460" class="flow"/>
  <path d="M1555 310 V338 H1127 V460" class="flow"/>
  <path d="M1555 310 V460" class="flow"/>
  <path d="M665 470 V448 H1500 V318" class="feedback"/>
  <path d="M1127 470 V448 H1525 V318" class="feedback"/>
  <path d="M1589 470 V318" class="feedback"/>
  <text x="1010" y="461" text-anchor="middle" class="small" fill="#2563eb">证据缺口、实验缺口或写作检查未通过 → 返回 Planner 重新规划</text>
  <path d="M365 780 H400 V525 H462" class="guide"/>
  <text x="382" y="512" class="small" fill="#7c3aed" transform="rotate(-90 382 512)">用户指导在下一个安全节点生效</text>

  <!-- Review and delivery -->
  <g filter="url(#shadow)">
    <rect x="425" y="735" width="255" height="135" rx="17" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
    <rect x="735" y="710" width="545" height="190" rx="20" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2.5"/>
    <rect x="1335" y="735" width="255" height="135" rx="17" fill="#ffffff" stroke="#ec4899" stroke-width="2"/>
    <rect x="1640" y="710" width="210" height="190" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="780" y="960" width="735" height="90" rx="22" fill="#173b67"/>
  </g>

  <text x="552" y="775" text-anchor="middle" class="box-title">自主初稿完成</text>
  <text x="452" y="807" class="box-text">• 完整 Markdown 论文</text>
  <text x="452" y="837" class="box-text">• 图表、实验与引用已嵌入</text>

  <text x="1007" y="746" text-anchor="middle" class="box-title">四模型并行审稿（中文输出）</text>
  <rect x="766" y="770" width="230" height="45" rx="12" fill="#ede9fe"/>
  <rect x="1018" y="770" width="230" height="45" rx="12" fill="#ede9fe"/>
  <rect x="766" y="830" width="230" height="45" rx="12" fill="#ede9fe"/>
  <rect x="1018" y="830" width="230" height="45" rx="12" fill="#ede9fe"/>
  <text x="881" y="799" text-anchor="middle" class="box-text">审稿人1：方法合理性</text>
  <text x="1133" y="799" text-anchor="middle" class="box-text">审稿人2：实验证据</text>
  <text x="881" y="859" text-anchor="middle" class="box-text">审稿人3：引用规范</text>
  <text x="1133" y="859" text-anchor="middle" class="box-text">审稿人4：反方质疑</text>

  <text x="1462" y="775" text-anchor="middle" class="box-title">综合修订</text>
  <text x="1362" y="807" class="box-text">• 汇总四方意见</text>
  <text x="1362" y="837" class="box-text">• Writer 证据约束修订</text>

  <text x="1745" y="746" text-anchor="middle" class="box-title">质量闸门</text>
  <text x="1665" y="780" class="small">✓ 四审稿人均完成</text>
  <text x="1665" y="810" class="small">✓ 引用与参考文献核对</text>
  <text x="1665" y="840" class="small">✓ 图表与正文对应检查</text>
  <text x="1665" y="870" class="small">✓ 未通过则继续修订</text>

  <path d="M1589 640 V700 H552 V727" class="flow"/>
  <path d="M680 802 H727" class="flow"/>
  <path d="M1280 802 H1327" class="flow"/>
  <path d="M1590 802 H1632" class="flow"/>
  <path d="M1462 735 V690 H1007 V702" class="feedback"/>
  <text x="1225" y="690" text-anchor="middle" class="small" fill="#2563eb">仍需修改 → 再次审稿（按配置轮数）</text>
  <path d="M1745 900 V930 H1515 V950" class="flow"/>

  <text x="1147" y="993" text-anchor="middle" class="white-title">最终交付</text>
  <text x="1147" y="1025" text-anchor="middle" class="white-text">论文 Markdown　｜　PDF　｜　参考文献 TXT（题名、期刊、DOI）　｜　审稿与质量检查记录</text>

  <text x="1880" y="1055" text-anchor="end" class="small">SciAssistant V2 · Hybrid Autonomous Research Workflow</text>
</svg>
